                              onChange={() => handleToggleChecklist('stroller')}
                              className="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                            />
                            <div>
                              <span className="font-bold text-slate-900 block">5歲小孩輕便推車與水壺</span>
                              <span className="text-slate-500 block mt-0.5">堺町通、狸小路推推，保障小孩不賴皮，大總管之盾。</span>
                            </div>
                          </label>

                          <label className="flex items-start gap-3 p-3 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors cursor-pointer text-xs">
                            <input
                              type="checkbox"
                              checked={checklist.taxFreeQr}
                              onChange={() => handleToggleChecklist('taxFreeQr')}
                              className="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                            />
                            <div>
                              <span className="font-bold text-slate-900 block">2026 免稅 QR Code 開通</span>
                              <span className="text-slate-500 block mt-0.5">在 VJW 系統完成登入並貼上上陸許可，血拼更輕鬆。</span>
                            </div>
                          </label>
                        </div>
                      </div>

                      <div className="lg:col-span-2 space-y-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                          <h4 className="font-bold text-slate-900 text-sm flex items-center gap-2">
                            <span>✍️</span> 大總管隨身記（點擊輸入）
                          </h4>
                          <textarea
                            rows={3}
                            placeholder="例如：爸媽隨身藥品放在背包前袋、5歲小孩必備軟糖多帶兩包、機場 Kinotoya 霜淇淋一定要排隊搶、Day 3 要打給乃之風確認大巴接駁時間..."
                            value={customNotes}
                            onChange={(e) => setCustomNotes(e.target.value)}
                            className="w-full text-xs p-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                          />
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                          <h4 className="font-bold text-slate-900 text-sm border-b pb-3 flex items-center justify-between">
                            <span>📍</span> 精選行程客製化備忘卡
                            <span className="text-[10px] text-slate-400 font-normal">可勾選核對，或在下方自行追加新行程點</span>
                          </h4>

                          <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                            {myTripList.length > 0 ? (
                              myTripList.map((t) => (
                                <div key={t.id} className="flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition-all border border-slate-150">
                                  <div className="flex items-center gap-3">
                                    <input
                                      type="checkbox"
                                      checked={t.done}
                                      onChange={() => handleToggleTripDone(t.id)}
                                      className="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                                    />
                                    <div>
                                      <span className="inline-block bg-indigo-100 text-indigo-800 text-[9px] font-bold px-1.5 py-0.5 rounded mr-1.5">
                                        Day {t.day}
                                      </span>
                                      <span className="inline-block text-slate-500 text-xs font-mono font-semibold mr-2">{t.time}</span>
                                      <span className={`text-xs ${t.done ? 'line-through text-slate-400' : 'text-slate-800 font-medium'}`}>
                                        {t.title}
                                      </span>
                                    </div>
                                  </div>
                                  <button
                                    onClick={() => handleDeleteTrip(t.id)}
                                    className="text-xs text-red-400 hover:text-red-600 font-bold px-2 py-1"
                                  >
                                    ✕
                                  </button>
                                </div>
                              ))
                            ) : (
                              <p className="text-slate-400 text-xs py-6 text-center">行程為空，可在下方添加！</p>
                            )}
                          </div>

                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-150 space-y-3">
                            <span className="block text-[11px] font-bold text-slate-500">➕ 追加自訂行程點</span>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                              <select
                                value={newTripDay}
                                onChange={(e) => setNewTripDay(e.target.value)}
                                className="p-2 border border-slate-250 bg-white text-xs rounded-lg outline-none"
                              >
                                {[1,2,3,4,5].map(dayNum => (
                                  <option key={dayNum} value={dayNum}>Day 0{dayNum}</option>
                                ))}
                              </select>
                              <input
                                type="time"
                                value={newTripTime}
                                onChange={(e) => setNewTripTime(e.target.value)}
                                className="p-2 border border-slate-250 bg-white text-xs rounded-lg outline-none"
                              />
                              <input
                                type="text"
                                placeholder="例如：狸小路藥妝瘋狂大採購"
                                value={newTripTitle}
                                onChange={(e) => setNewTripTitle(e.target.value)}
                                className="p-2 border border-slate-250 bg-white text-xs rounded-lg outline-none"
                              />
                            </div>
                            <button
                              onClick={handleAddCustomTrip}
                              className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2 rounded-lg transition-colors shadow-sm"
                            >
                              新增至我的計畫卡
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              <footer className="bg-slate-900 text-slate-400 py-12 px-4 sm:px-6 lg:px-8 mt-16 border-t border-slate-800">
                <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">❄️</span>
                    <div>
                      <p className="text-sm font-bold text-white">0923～0927北海道 ‧ 尊榮家庭旅行神盾</p>
                      <p className="text-xs text-slate-500 mt-0.5">© 2026 Trip.com Group & 0923～0927北海道. All rights reserved.</p>
                    </div>
                  </div>
                  <div className="flex gap-6 text-xs text-slate-500">
                    <span>使用貨幣: 日圓 JPY</span>
                    <span>最新入境通關更新時間: 2026/06/01</span>
                  </div>
                </div>
              </footer>
            </div>
          );
        }

        // 將 App 組件渲染到畫面上
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
