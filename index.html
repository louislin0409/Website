                      <p className="text-sm text-slate-500 mt-1">集結二條市場、三角市場、乃之風及 GARAKU 湯咖哩的精華實測筆記。</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <div className="flex items-center gap-3">
                          <span className="text-3xl">🍛</span>
                          <div>
                            <h4 className="font-bold text-slate-900 text-lg">GARAKU 湯咖哩與姊妹店 Treasure 秘辛</h4>
                            <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full">市區 vs 機場攻略</span>
                          </div>
                        </div>
                        <div className="text-xs text-slate-600 space-y-2 leading-relaxed">
                          <p><strong>GARAKU 本店排隊噩夢：</strong>位於南2條西2丁目的 GARAKU 札幌本店，常年大排長龍，等待時間通常在 1.5 到 3 小時之間。</p>
                          <p><strong>神盾戰術 1：國內線機場店卡位。</strong>本行程 Day 5 設計在上午 10:30 由平輩特攻隊先去新千歲機場國內線 3 樓 GARAKU 排隊，11:00 準時開門入座大桌。機場店相比市區容易吃得多！</p>
                          <p><strong>神盾戰術 2：直攻姊妹店「TREASURE」。</strong>Treasure 就在 GARAKU 本店同一條街上，是同一個主廚開設，兩者共享靈魂香料秘方，但 Treasure 還融入了多種醬汁選擇（如原創、和風、椰子）及更豐富的客製化搭配。最重要的是，排隊人潮只有 GARAKU 的三分之一！</p>
                        </div>
                      </div>

                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <div className="flex items-center gap-3">
                          <span className="text-3xl">🦀</span>
                          <div>
                            <h4 className="font-bold text-slate-900 text-lg">二條市場 vs 三角市場挑蟹指南</h4>
                            <span className="bg-indigo-100 text-indigo-800 text-[10px] font-bold px-2 py-0.5 rounded-full">帝王蟹防坑技巧</span>
                          </div>
                        </div>
                        <div className="text-xs text-slate-600 space-y-2 leading-relaxed">
                          <p><strong>小樽三角市場（Day 2）：</strong>離小樽站步行僅 1 分鐘，市場建在有傾斜的長廊上。此處海味以「新鮮活蟹」為王，可以當場挑選一隻巨大活帝王蟹，店家會當面秤重開價，做兩吃（烤腳 + 蒸蟹身）。記得確認「含水盆重」和「單價」，並請店員拿起來讓您與螃蟹合照！</p>
                          <p><strong>札幌二條市場（Day 3）：</strong>位於札幌市區，步行從大通或狸小路都很近。這裡觀光客較多，內側通道店家定價通常偏觀光客導向。</p>
                          <p><strong>大總管避雷法：</strong>二條市場直攻「外圍露天攤位」，挑選現剖海膽（¥1500-¥3000）或現開生蠔，品質與價格都較公開透明。</p>
                        </div>
                      </div>

                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <div className="flex items-center gap-3">
                          <span className="text-3xl">🏨</span>
                          <div>
                            <h4 className="font-bold text-slate-900 text-lg">洞爺湖乃之風 ‧ 煙火頭等艙攻略</h4>
                            <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full">乃之風行政房優勢</span>
                          </div>
                        </div>
                        <div className="text-xs text-slate-600 space-y-2 leading-relaxed">
                          <p><strong>煙火免挨凍：</strong>洞爺湖煙火大會是在每年 4 月底至 10 月底的晚上 20:45 施放。一般旅客需要走到戶外湖畔，受寒風吹襲。</p>
                          <p><strong>觀景行政房（乃之風俱樂部）：</strong>本行程特選行政房型，房間擁有超大片整面落地玻璃窗，正對湖面施放點。當晚煙火會在您窗前完美展開。您可以將暖氣調至最舒適、穿著飯店浴衣，全家人圍坐在窗前大沙發，一邊喝著北海道牛奶，一邊獨享這 20 分鐘的震撼！</p>
                        </div>
                      </div>

                          <div>

                            <span className="bg-rose-100 text-rose-800 text-[10px] font-bold px-2 py-0.5 rounded-full">尊榮吃到飽細節</span>
                          </div>
                        </div>
                        <div className="text-xs text-slate-600 space-y-2 leading-relaxed">

                          <p><strong>專人去殼、優雅吃蟹：</strong>一般吃螃蟹，最頭痛的就是用剪刀剪蟹殼，剪到雙手油膩、時間過去、胃口也沒了，長輩更是吃力。KANIZA 特色在於「預先開好殼的巨大蟹腳」，輕輕一剝整條蟹肉直接彈出，極其適合小孩與老人！大人還能專心涮著頂級和牛，是完美的尊榮大餐。</p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                        <p className="text-xs sm:text-sm text-slate-500 mt-1">您可以在此核對行前檢核表，或自行加入/調整 5 天的行程項目，打包成大總管小抄分享！</p>
                      </div>
                      <button onClick={handleCopyPlanner} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-md transition-all flex items-center gap-2 self-stretch sm:self-auto justify-center"><span>📋</span> 複製尊榮計畫到 Line 分享</button>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">

                            </div>
                          </label>
                          <label className="flex items-start gap-3 p-3 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors cursor-pointer text-xs">

                            <div>

                            <div>
                              <span className="font-bold text-slate-900 block">JR Airport 號 U-Seat 已訂妥</span>
                              <span className="text-slate-500 block mt-0.5">Day 1（機場-札幌）及 Day 5（札幌-機場）預約指定席。</span>
                            </div>
                          </label>
                          <label className="flex items-start gap-3 p-3 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors cursor-pointer text-xs">
                            <input type="checkbox" checked={checklist.warmClothes} onChange={() => handleToggleChecklist('warmClothes')} className="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
                            <div>
                              <span className="font-bold text-slate-900 block">防寒、雨具衣服打包</span>
                              <span className="text-slate-500 block mt-0.5">9月北海道早晚溫差大，備好長袖風衣、隨身折疊傘。</span>
                            </div>
                          </label>
                          <label className="flex items-start gap-3 p-3 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors cursor-pointer text-xs">
                            <input type="checkbox" checked={checklist.stroller} onChange={() => handleToggleChecklist('stroller')} className="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
                            <div>
                              <span className="font-bold text-slate-900 block">5歲小孩輕便推車與水壺</span>

                              <span className="font-bold text-slate-900 block">2026 免稅 QR Code 開通</span>

                            </div>
                          </label>
                        </div>
                      </div>

                      <div className="lg:col-span-2 space-y-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                          <h4 className="font-bold text-slate-900 text-sm flex items-center gap-2"><span>✍️</span> 大總管隨身記（點擊輸入）</h4>

                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">

                          <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                            {myTripList.length > 0 ? myTripList.map(t => (

                                    <span className="inline-block bg-indigo-100 text-indigo-800 text-[9px] font-bold px-1.5 py-0.5 rounded mr-1.5">Day {t.day}</span>

                                    <span className={`text-xs ${t.done ? 'line-through text-slate-400' : 'text-slate-800 font-medium'}`}>{t.title}</span>

                                <button onClick={() => handleDeleteTrip(t.id)} className="text-xs text-red-400 hover:text-red-600 font-bold px-2 py-1">✕</button>

                          <form onSubmit={handleAddCustomTrip} className="bg-slate-50 p-4 rounded-xl border border-slate-150 space-y-3">

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                              <select value={newTripDay} onChange={e => setNewTripDay(e.target.value)} className="p-2 border border-slate-200 bg-white text-xs rounded-lg outline-none">
                                {[1, 2, 3, 4, 5].map(dayNum => <option key={dayNum} value={dayNum}>Day 0{dayNum}</option>)}
                              </select>
                              <input type="time" value={newTripTime} onChange={e => setNewTripTime(e.target.value)} className="p-2 border border-slate-200 bg-white text-xs rounded-lg outline-none" />
                              <input type="text" placeholder="例如：狸小路藥妝瘋狂大採購" value={newTripTitle} onChange={e => setNewTripTitle(e.target.value)} className="p-2 border border-slate-200 bg-white text-xs rounded-lg outline-none" />
                            </div>
                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2 rounded-lg transition-colors shadow-sm">新增至我的計畫卡</button>
                          </form>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              <footer className="bg-slate-900 text-slate-400 py-12 px-4 sm:px-6 lg:px-8 mt-16 border-t border-slate-800">
                <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">❄️</span>
                    <div>
                      <p className="text-sm font-bold text-white">0923～0927北海道 ‧ 尊榮家庭旅行神盾</p>
                      <p className="text-xs text-slate-500 mt-0.5">© 2026 Trip.com Group & 0923～0927北海道. All rights reserved.</p>
                    </div>
                  </div>
                  <div className="flex gap-6 text-xs text-slate-500">
                    <span>使用貨幣: 日圓 JPY</span>
                    <span>最新入境通關更新時間: 2026/06/01</span>
                  </div>
                </div>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
